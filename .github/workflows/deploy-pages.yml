name: Deploy GitHub Pages

on:
  push:
    branches:
      - master
  schedule:
    - cron: "53 13 * * *"   # daily, 30 min after deals-galore refreshes /papers
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11.7.0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build static site
        run: pnpm build

      - name: Add Paper Desk (/papers)
        # Generated daily by gladiatorAsh/deals-galore (python -m paperfeed update).
        run: |
          mkdir -p out/papers
          curl -fsSL --retry 3 \
            https://raw.githubusercontent.com/gladiatorAsh/deals-galore/main/data/papers.html \
            -o out/papers/index.html \
            || { echo "::warning::Paper Desk page not available; /papers skipped"; rm -f out/papers/index.html; }

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
